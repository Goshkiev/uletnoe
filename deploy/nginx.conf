# Шаблон: install.sh подставляет __DOMAIN__ и __ROOT__. certbot потом добавляет HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __ROOT__;
    index index.html;
    charset utf-8;
    client_max_body_size 64k;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Служебные файлы репозитория наружу не отдаём.
    location ~ /\. { deny all; }
    location ^~ /server/ { deny all; }
    location ^~ /deploy/ { deny all; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location ~* \.(json|js|css|html|webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}
