<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Меню кафе «Улётное»</title>
  <meta name="description" content="Меню кафе «Улётное»: бургеры, шаурма, сувлаки, гирос, хот-доги, фритюр и напитки.">
  <meta name="theme-color" content="#172136">
  <link rel="icon" href="img/icon.png">
  <link rel="preload" href="fonts/montserrat-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <img class="logo" src="img/logo.jpg" alt="Кафе «Улётное»" width="800" height="336">
    <p class="tagline">Выбери свой бургер!</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Разделы меню"></nav>

  <main id="menu">
    <p class="loading">Загружаем меню…</p>
  </main>

  <footer class="footer" id="footer"></footer>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <button type="button" class="sheet-close" aria-label="Закрыть">×</button>
      <div id="sheet-body"></div>
    </div>
  </div>

  <button type="button" class="cart-bar" id="cart-bar" hidden></button>

  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
