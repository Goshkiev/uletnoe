<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Меню кафе «Улётное»</title>
  <meta name="description" content="Меню кафе «Улётное»: бургеры, шаурма, сувлаки, гирос, хот-доги, фритюр и напитки.">
  <meta name="theme-color" content="#172136">
  <link rel="icon" href="img/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<body>

    <img class="logo" src="img/logo.jpg" alt="Кафе «Улётное»" width="800" height="336">

    <p class="loading">Загружаем меню…</p>

      <button type="button" class="sheet-close" aria-label="Закрыть">×</button>
      <div id="sheet-body"></div>

  </div>

  <button type="button" class="cart-bar" id="cart-bar" hidden></button>

  <script src="config.js"></script>
